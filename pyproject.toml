[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triad-local"
version = "0.1.0"
description = "Local, harness-independent Designer / Supervisor / Worker orchestration"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
triad = "triad.cli:main"

[tool.setuptools.packages.find]
include = ["triad*"]
